<script type="module">
import * as THREE from 'three';
const tileId = new URLSearchParams(location.search).get('tile') || 'b1-lane';
const table = (await (await fetch('cameras.json')).json()).tiles[tileId];
const spec = await (await fetch(table.spec)).json();
spec.cameras = table.cameras;
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'eye';
const mode = params.get('mode') || 'design'; // 'design' adds the designed additions
const W=1280,H=720;
const r = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background=new THREE.Color(0x9db8d6); s.fog=new THREE.Fog(0x9db8d6,120,520);
s.add(new THREE.HemisphereLight(0xdfe8ff,0x4a3f2a,1.0)); const sun=new THREE.DirectionalLight(0xfff2d0,1.4); sun.position.set(-60,100,-40); s.add(sun);
// deterministic rng
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
// terrain: designed gentle swell; before = flat
const design = mode==='design';
const hgt=(x,z)=> design ? 0.7*Math.sin(x*0.045+z*0.03)+0.5*Math.sin(z*0.07-x*0.02)-0.012*Math.abs(x)*0 + (Math.abs(x)>6?0.35*Math.min(1,(Math.abs(x)-6)/10):0) - (Math.abs(x)<6&&Math.abs(x)>3.6?0.35:0) : 0;
const g=new THREE.PlaneGeometry(260,260,130,130); g.rotateX(-Math.PI/2);
const pos=g.attributes.position, col=new Float32Array(pos.count*3);
const cA=new THREE.Color(0x6f9650), cB=new THREE.Color(0x587d3f), cC=new THREE.Color(0x8aa05a), cD=new THREE.Color(0x7a5a38), cE=new THREE.Color(0x9a8a6a), cF=new THREE.Color(0x4f6f3a);
const n2=(x,z)=>Math.sin(x*0.21+Math.sin(z*0.17)*2)*Math.sin(z*0.13+x*0.05)+0.5*Math.sin(x*0.6+z*0.45);
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i)+75;const y=hgt(x,z);pos.setY(i,y);pos.setZ(i,z);
 let c=cA.clone();
 if(design){ const n=n2(x,z); c=cA.clone().lerp(n>0.3?cC:cB,Math.min(1,Math.abs(n)*0.8));
  const d=Math.abs(x); if(d<3.6) c=cD.clone().lerp(cE,(n+1)*0.2); else if(d<5.2) c=cE.clone().lerp(cA,(d-3.6)/1.6); else if(d<9&&n>0) c.lerp(cF,0.5);
 } else { if(Math.abs(x)<3) c=new THREE.Color(0x7b5a39); }
 col.set([c.r,c.g,c.b],i*3);} 
g.setAttribute('color',new THREE.BufferAttribute(col,3)); g.computeVertexNormals();
s.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
const box=(w,h,d,c,x,z,y=0,ry=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,hgt(x,z)+y+h/2,z);m.rotation.y=ry;s.add(m);return m};

for(const [x,z] of spec.houses){ box(4.4,3.2,4.7,0xcfc6b4,x,z); const roof=new THREE.Mesh(new THREE.ConeGeometry(3.6,2.4,4),new THREE.MeshLambertMaterial({color:0xa83a2c})); roof.position.set(x,hgt(x,z)+4.4,z); roof.rotation.y=Math.PI/4; roof.scale.set(1,1,1.08); s.add(roof);
  box(1.0,2.6,0.2,0x4a2f1c,x+(x<0?2.25:-2.25),z,0,Math.PI/2); }
box(4,1.2,1,0x6b4a2b,spec.cart[0],spec.cart[1],0.4); // cart
box(0.5,3.4,0.5,0x4a3a2a,-4.5,25); box(0.5,3.4,0.5,0x4a3a2a,4.5,25); box(9.5,0.5,0.5,0x4a3a2a,0,25,3.2); // gate 5m opening
// Knight scale figure
const kn=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,1.2,4,8),new THREE.MeshLambertMaterial({color:0xffd24a})); kn.position.set(0.8,hgt(0.8,52)+0.9,52); s.add(kn);
if(design){
 const tree=(x,z,sc=1)=>{const h=0;const t=new THREE.Mesh(new THREE.CylinderGeometry(0.25*sc,0.4*sc,3.4*sc,7),new THREE.MeshLambertMaterial({color:0x5a3d22})); t.position.set(x,hgt(x,z)+1.7*sc,z); s.add(t);
  for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.IcosahedronGeometry((3.0-k*0.5)*sc,0),new THREE.MeshLambertMaterial({color:[0x3f6f35,0x4c7f3b,0x5a8c44][k],flatShading:true})); c.position.set(x+(rnd()-.5)*1.2*sc,hgt(x,z)+(4.0+k*1.3)*sc,z+(rnd()-.5)*1.2*sc); s.add(c);} };
 // large oaks (9-12 m) in clusters, hedgerow trees along both verges
 [[-24,34,1.4],[-30,40,1.1],[26,38,1.3],[34,44,1.0],[-22,66,1.2],[24,62,1.5],[30,70,1.1],[-34,84,1.3],[34,90,1.2],[-24,112,1.3],[26,120,1.1],[-9,44,0.8],[9,52,0.8]].forEach(a=>tree(...a));
 // verge: stone-and-hedge fence runs 1.6 m high, gaps at house paths
 const fenceRun=(x,z0,z1)=>{for(let z=z0;z<z1;z+=3.4){ if(Math.abs(z-70)<9||Math.abs(z-90)<3)continue; box(0.35,1.6,3.3,0x8a8578,x,z+1.7); const hh=box(0.9,1.1,3.3,0x3f6b34,x+(x<0?-0.4:0.4),z+1.7); }};
 fenceRun(-6.2,32,115); fenceRun(6.2,32,115);
 // lanterns every 18 m on alternating sides
 for(let z=40;z<112;z+=18){const x=(z/18|0)%2?-5.2:5.2; box(0.15,3.4,0.15,0x2b2b2b,x,z); box(0.45,0.45,0.45,0xffc05a,x,z,3.4);} 
 // props near houses: barrels, crates, haystacks, woodpiles, wheelbarrow
 const props=[[-12,57,.9,.9,.9,0x7a5230],[-12.8,58,.7,.7,.7,0x8a6a40],[11,76,1.1,.9,1.1,0x9a7a45],[-12,81,1.6,1.4,1.2,0xd1b25a],[12,105,2.2,1.6,1.6,0xd1b25a],[-24,97,0.9,0.9,1.9,0x6b4a2b],[10.5,77,1.0,.8,2.1,0x7b5c3a],[-20,101,1,1,1,0x7a5230]];
 for(const p of props) box(p[2],p[3],p[4],p[5],p[0],p[1]);
 // flower patches
 for(let i=0;i<260;i++){const x=(rnd()<.5?-1:1)*(6.5+rnd()*12),z=30+rnd()*85; const m=new THREE.Mesh(new THREE.SphereGeometry(0.12,4,3),new THREE.MeshLambertMaterial({color:[0xe8d85a,0xf2f2f2,0xc86ad0,0xe86a5a][i%4]})); m.position.set(x,hgt(x,z)+0.45,z); s.add(m);} 
 // ruts
 for(const rx of [-1.0,1.0]) box(0.3,0.03,86,0x4a3722,rx,70,0.02);
 // tall grass tufts near verge
 for(let i=0;i<700;i++){const x=(rnd()<.5?-1:1)*(5.5+rnd()*30),z=26+rnd()*92; const m=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.7+rnd()*0.5,3),new THREE.MeshLambertMaterial({color:0x7aa04a})); m.position.set(x,hgt(x,z)+0.35,z); s.add(m);} 
} else {
 for(let i=0;i<120;i++){const x=(rnd()-.5)*60,z=26+rnd()*90; if(Math.abs(x)<3)continue; const m=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.9,3),new THREE.MeshLambertMaterial({color:0x88b060})); m.position.set(x,0.45,z); s.add(m);} 
 box(1,1.4,32,0x5a2f26,0,90); // existing fence-lane
}
const c=spec.cameras[view]; const cam=new THREE.PerspectiveCamera(c.fov*(W/H>1?1:1),W/H,0.1,2000);
const ty=(p)=>p; cam.position.set(c.pos[0],c.pos[1]+(view==='eye'?hgt(c.pos[0],c.pos[2]):0),c.pos[2]); cam.lookAt(c.look[0],c.look[1],c.look[2]);
r.render(s,cam); window.__done=true;
</script>
