<script type="module">

import * as THREE from 'three';

const cx = 30, cz = 100, half = 300;

  else if (['mill', 'chapel', 'loft'].includes(st.kind)) { box(st.w * 0.7, 5, st.d * 0.7, 0xbfb6a4, st.x, st.z); }
  else if (st.kind === 'cart') box(4, 1.2, 1, 0x6b4a2b, st.x, st.z, 0, 0.4);
  else if (st.kind === 'fence') box(st.w, 0.9, 0.5, 0x5a2f26, st.x, st.z);
  else if (st.kind === 'gate') { box(0.5, 4, 0.5, 0x4a3a2a, st.x - st.w / 2, st.z); box(0.5, 4, 0.5, 0x4a3a2a, st.x + st.w / 2, st.z); box(st.w, 0.5, 0.5, 0x4a3a2a, st.x, st.z, 0, 4); }

  } else if (id.startsWith('bush')) { const t = sz ?? { w: 1.4, h: 1.1 }; const m = new THREE.Mesh(new THREE.IcosahedronGeometry(t.w * 0.5 * k, 0), mat(id.includes('flower') ? 0x7ab060 : 0x4c7f3b, true)); m.position.set(p.x, t.h * 0.5 * k, p.z); m.scale.y = t.h / t.w; s.add(m); if (id.includes('flower')) { for (let i = 0; i < 4; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.1, 4, 3), mat(0xf2d0e0)); f.position.set(p.x + Math.sin(i * 1.7) * 0.5 * k, t.h * 0.7 * k, p.z + Math.cos(i * 1.7) * 0.5 * k); s.add(f); } } }

  else if (id.startsWith('boulder') || id.startsWith('rock')) { const t = sz ?? { w: 2, h: 1.5 }; const m = new THREE.Mesh(new THREE.DodecahedronGeometry(t.w * 0.5 * k, 0), mat(0x8a8a90, true)); m.position.set(p.x, t.h * 0.35 * k, p.z); m.scale.y = t.h / t.w; s.add(m); }
  else if (id.startsWith('grass')) { const m = new THREE.Mesh(new THREE.ConeGeometry(0.25 * k, 0.6 * k, 4), mat(0x7aa04a)); m.position.set(p.x, 0.3 * k, p.z); s.add(m); }
  else if (id.startsWith('flower')) { const col = { yellow: 0xe8d85a, white: 0xf2f2f2, purple: 0xc86ad0, red: 0xe86a5a }[id.split('-')[2]]; const m = new THREE.Mesh(new THREE.SphereGeometry(0.3 * k, 5, 4), mat(col)); m.position.set(p.x, 0.3, p.z); m.scale.y = 0.6; s.add(m); }

}

r.render(s, cam); window.__done = true;
