name: CI

# PRs run once per push (no separate branch-push run); main runs after merge.
# Markdown at the repo root and asset provenance notes are skipped. Anything
# under src/ (e.g. the ANCHORS.md files that drift tests read) always runs CI.
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'public/assets/**/*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'public/assets/**/*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Main only, after the tests pass: the deploy job publishes this exact build (no second build).
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # Settings > Pages > Source is "GitHub Actions" (set 2026-10-27). PRs never deploy.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own group, never cancelled: a second quick merge must not cut a deploy off half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
