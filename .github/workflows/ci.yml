name: CI

# PRs run once per push (no separate branch-push run); main runs after merge.
# Markdown at the repo root and asset provenance notes are skipped. Anything
# under src/ (e.g. the ANCHORS.md files that drift tests read) always runs CI.
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'public/assets/**/*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'public/assets/**/*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Q14 (contracts v0.8): on a push to main, decides whether the test shards can be skipped because the PR's own green run
  # tested this exact tree (.github/scripts/main-gate.mjs; tested in src/ci/mainGate.test.ts). Any doubt, error or empty
  # output means the tests run. Never runs on a PR.
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: decide
        run: node .github/scripts/main-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Q14: the PR run records the tree it tested (the merge checkout), in the artifact's name, for the main-run gate.
      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
      # Main only: the deploy job publishes this exact build (no second build), once every test shard has passed.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # The vitest suite split by file across parallel jobs (vitest --shard hashes each file path, so every file runs in
  # exactly one shard). All shards must pass for the run to go green. A flaky shard can be re-run on its own.
  test:
    needs: [gate]
    # On a PR the gate is skipped and the tests run; on main they are skipped only on an explicit 'skip'.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.gate.outputs.tests != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    name: test (shard ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # Settings > Pages > Source is "GitHub Actions" (set 2026-10-27). PRs never deploy.
  deploy:
    needs: [gate, build, test]
    # Waits on the build always, and on the tests whenever they ran (skipped only by the gate's explicit 'skip').
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.gate.outputs.tests == 'skip')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own group, never cancelled: a second quick merge must not cut a deploy off half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
